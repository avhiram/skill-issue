name: Audit and clarify OSCP command titles
on:
  push:
    paths:
      - 'scripts/quality_oscp_titles.py'
      - '.github/workflows/quality-oscp-titles.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skill-issue-site-write
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Review and refine all OSCP command annotations
        run: python scripts/quality_oscp_titles.py
      - name: Check coverage and preserve original command syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('oscp-command-title-audit.json').read_text())
          a=r['totals']
          print(json.dumps(a,ensure_ascii=False,indent=2))
          assert a['generic_after']==0
          assert a['generic_before']>800
          assert a['identifiers_grouped']==1
          assert a['code_blocks_before']-a['code_blocks_after']<=30
          p=Path('docs/src/oscp/methodologie.md').read_text(encoding='utf-8')
          assert 'Exemples d\'identifiants et de champs à vérifier' in p
          assert 'admin:no pass' in p and '[boxname]:password' in p
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build VitePress
        run: npm run docs:build
      - name: Commit audited pages and styling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/src/oscp docs/.vitepress/theme/custom.css oscp-command-title-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Correct OSCP annotations and group non-command reference values"
            git push origin HEAD:main
          fi
