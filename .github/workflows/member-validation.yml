name: Validate member space

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/member-auth']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: python3 .github/scripts/prepare_crto_for_vitepress.py
      - run: python3 .github/scripts/normalize_site_dashes.py
      - name: Prepare native VitePress eJPT chapters
        run: |
          python3 -m pip install --disable-pip-version-check markdown-it-py==3.0.0 beautifulsoup4==4.12.3
          python3 scripts/render_ejpt_original.py "$RUNNER_TEMP/ejpt-render"
          python3 scripts/prepare_ejpt_native.py "$RUNNER_TEMP/ejpt-render"
      - run: npm run docs:build
      - name: Verify native eJPT build
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/.vitepress/dist/ejpt/original')
          report=json.loads((root/'import-report.json').read_text())
          assert len(report['pages'])==80
          for p in report['pages']:
              body=(root/p).read_text(encoding='utf-8')
              assert 'data-ejpt-native' in body and 'VPDoc' in body and 'VPNav' in body, p
          from bs4 import BeautifulSoup
          sheet=BeautifulSoup((root/'ejpt-cheatsheet.html').read_text(encoding='utf-8'),'html.parser').select_one('.ejpt-cheatsheet-content')
          assert sheet is not None, 'Missing native cheatsheet content'
          assert len(sheet.select('pre code'))==report['cheatsheet_display_blocks'], 'Unexpected change in displayed code block count'
          assert len(sheet.select('.ejpt-action-heading'))>=20, 'Missing information gathering action headings'
          assert len(sheet.select('.ejpt-existing-note-heading'))==report['cheatsheet_remaining_headings'], 'Incomplete remaining section headings'
          assert report['cheatsheet_remaining_headings']>=100, 'Incomplete remaining cheatsheet presentation'
          context=report['cheatsheet_context']
          assert len(sheet.select('[data-ejpt-note-description]'))==context['topic']+context['general'], 'Missing block context'
          assert context['topic']+context['general']>=100, 'Incomplete block descriptions'
          leaves=report['cheatsheet_leaf_titles']
          assert len(sheet.select('p.ejpt-leaf-title'))==leaves['plain_titles'], 'Missing plain code labels'
          assert len(sheet.select('span.ejpt-redundant-title'))==leaves['redundant_titles'], 'Duplicate title check failed'
          assert leaves['redundant_titles']>0, 'No repeated titles suppressed'
          enum=report['cheatsheet_enumeration']
          assert set(enum)=={'SMB','FTP','SSH','HTTP','SQL','SMTP'}, 'Missing reviewed enumeration service'
          assert len(sheet.select('.ejpt-reviewed-enum-description'))==sum(enum.values()), 'Enumeration descriptions incomplete'
          assert len(sheet.select('.ejpt-reviewed-enum-title'))==sum(enum.values()), 'Enumeration titles incomplete'
          assert len(sheet.select('.ejpt-va-title'))==report['cheatsheet_vulnerability_assessment']==5, 'Assessment titles incomplete'
          assert len(sheet.select('.ejpt-va-description'))==5, 'Assessment descriptions incomplete'
          system_layout=report['cheatsheet_system_layout']
          assert len(system_layout)==2, 'System sections incomplete'
          assert len(sheet.select('.ejpt-system-reviewed-heading'))==sum(x['headings'] for x in system_layout), 'System headings incomplete'
          assert len(sheet.select('.ejpt-system-section-context'))==sum(x['descriptions'] for x in system_layout), 'System context incomplete'
          network_layout=report['cheatsheet_network_layout']
          assert network_layout['sources']==3, 'Network capture source coverage incomplete'
          assert len(sheet.select('.ejpt-network-reviewed-title'))==network_layout['groups'], 'Network capture titles incomplete'
          assert len(sheet.select('.ejpt-network-reviewed-description'))==network_layout['groups'], 'Network capture descriptions incomplete'
          framework=report['cheatsheet_framework_layout']
          assert len(framework)==2, 'Framework chapters incomplete'
          assert len(sheet.select('.ejpt-framework-reviewed-heading'))==sum(x['headings'] for x in framework), 'Framework headings incomplete'
          assert len(sheet.select('.ejpt-framework-context'))==sum(x['descriptions'] for x in framework), 'Framework context incomplete'
          assert sum(x['blocks'] for x in report['cheatsheet_block_sizes'].values())==len(sheet.select('pre code')), 'Block size inventory incomplete'
          assert len(sheet.select('.ejpt-footprint-heading'))==report['cheatsheet_footprinting_actions']==7, 'Incomplete footprinting presentation'
          assert len(sheet.select('h4[id^="reseau-"]'))==15, 'Missing networking platform headings'
          assert not any('cheatsheet-files/ejpt-cheatsheet_nolinks.' in a.get('href','') for a in sheet.select('a[href]')), 'Obsolete export link'
          assert sheet.select_one('h2#complements-de-revision'), 'Missing folded complement'
          print('80 native VitePress eJPT pages validated; cheatsheet presentation and displayed block count verified (237 source blocks)')
          PY
      - name: Verify public and member pages
        run: |
          test -s docs/.vitepress/dist/index.html
          test -s docs/.vitepress/dist/membres/index.html
          grep -q 'Espace membre' docs/.vitepress/dist/membres/index.html
          test -s docs/.vitepress/dist/academy/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('docs/.vitepress/dist')
          paths = json.loads((root / 'offline-index.json').read_text())['files']
          assert not any(p.startswith('membres/') for p in paths), 'Member page in offline index'
          assert not any(p.startswith('crto/liham/') for p in paths), 'Private path in offline index'
          PY
      - name: Audit rendered Markdown
        run: python3 scripts/audit_rendered_markdown.py docs/.vitepress/dist --output docs/.vitepress/dist/audit/site-rendering.json --strict
