name: Import the complete Hacker Recipes codebase

on:
  push:
    paths:
      - '.github/workflows/import-full-thehackerrecipes.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all source files and assets
        run: |
          cp docs/.vitepress/theme/custom.css "$RUNNER_TEMP/skill-issue.css"
          cp docs/public/logo.svg "$RUNNER_TEMP/skill-issue-logo.svg"
          git clone --depth 1 https://github.com/The-Hacker-Recipes/The-Hacker-Recipes.git "$RUNNER_TEMP/hacker-recipes"
          rsync -a --delete --exclude='.git/' --exclude='.github/' "$RUNNER_TEMP/hacker-recipes/" ./
          echo "Source files downloaded:"
          find docs/src -type f | wc -l

      - name: Apply SKILL-ISSUE branding without removing the technical documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os
          from shutil import copyfile

          config_path = Path("docs/.vitepress/config.mts")
          config = config_path.read_text(encoding="utf-8")
          assert 'title: "The Hacker Recipes"' in config, "Unexpected upstream config; aborting to avoid damaging the site"

          config = config.replace(
              '    title: "The Hacker Recipes",',
              "    title: 'SKILL-ISSUE',\n    base: '/skill-issue/',\n    lang: 'fr-FR',\n    appearance: 'force-dark',",
              1
          )
          config = config.replace(
              'description: "The Hacker Recipes is aimed at freely providing technical guides on various hacking topics"',
              "description: 'Documentation cybersécurité, références et commandes'"
          )
          config = config.replace("lastUpdated: true,", "lastUpdated: false,", 1)
          config = config.replace("hostname: 'https://thehacker.recipes'", "hostname: 'https://avhiram.github.io/skill-issue/'", 1)

          # Avoid retaining analytics and favicons belonging to the upstream site
          start = config.index("    head: [")
          end = config.index("    transformHead:", start)
          config = config[:start] + """    head: [
              ['meta', { name: 'theme-color', content: '#09070E' }],
              ['link', { rel: 'icon', type: 'image/svg+xml', href: '/skill-issue/logo.svg' }]
          ],
          """ + config[end:]
          config = config.replace("The Hacker Recipes", "SKILL-ISSUE")
          config = config.replace(
              "https://thehacker.recipes/images/social-preview.png",
              "https://avhiram.github.io/skill-issue/logo.svg"
          )
          config = config.replace("dark: '/images/logo.svg'", "dark: '/logo.svg'")
          config = config.replace("light: '/images/logo.svg'", "light: '/logo.svg'")

          start = config.index("        nav: [")
          end = config.index('        outline: "deep",', start)
          config = config[:start] + """        nav: [
              { text: 'Accueil', link: '/' },
          ],
          """ + config[end:]

          # Preserve every technical sidebar topic, but hide the upstream contribution/ads menu
          marker = '            {\n                "text": "Contributing & misc"'
          start = config.find(marker)
          if start != -1:
              end = config.find("\n            },", start)
              assert end != -1, "Contributing section structure changed"
              config = config[:start] + config[end + len("\n            },"):]
          config = config.replace(
              "https://github.com/The-Hacker-Recipes/The-Hacker-Recipes' },",
              "https://github.com/avhiram/skill-issue' },"
          )
          config = config.replace(
              '        editLink: {\n            text: "Contribute to this page",\n            pattern: \'https://github.com/The-Hacker-Recipes/The-Hacker-Recipes/edit/main/docs/src/:path\'\n        }',
              "        editLink: false"
          )
          assert "Contributing & misc" not in config
          assert "Contribute to this page" not in config
          config_path.write_text(config, encoding="utf-8")

          # Keep the functional sidebar, code tabs and image zoom; remove old sponsor/author widgets
          theme_path = Path("docs/.vitepress/theme/index.ts")
          theme_path.write_text("""import { onMounted, nextTick, watch } from 'vue'
          import type { Theme } from 'vitepress'
          import DefaultTheme from 'vitepress/theme'
          import CustomSidebarItem from './components/CustomSidebarItem.vue'
          import { enhanceAppWithTabs } from 'vitepress-plugin-tabs/client'
          import mediumZoom from 'medium-zoom'
          import { useRoute } from 'vitepress'
          import './custom.css'

          export default {
            extends: DefaultTheme,
            enhanceApp({ app }) {
              app.component('VPSidebarItem', CustomSidebarItem)
              enhanceAppWithTabs(app)
            },
            setup() {
              const route = useRoute()
              const initZoom = () => mediumZoom('.main img', {
                background: 'var(--vp-c-bg)',
                margin: 20
              })
              onMounted(initZoom)
              watch(() => route.path, () => nextTick(initZoom))
            }
          } satisfies Theme
          """, encoding="utf-8")

          theme_css = Path("docs/.vitepress/theme/custom.css")
          original_css = theme_css.read_text(encoding="utf-8")
          own_css = Path(os.environ["RUNNER_TEMP"], "skill-issue.css").read_text(encoding="utf-8")
          theme_css.write_text(original_css + "\n\n/* SKILL-ISSUE custom dark purple identity */\n" + own_css, encoding="utf-8")

          newlogo = Path(os.environ["RUNNER_TEMP"], "skill-issue-logo.svg")
          for dest in [
              "docs/src/public/logo.svg",
              "docs/src/public/images/logo.svg",
              "docs/public/logo.svg",
              "logo.svg",
          ]:
              Path(dest).parent.mkdir(parents=True, exist_ok=True)
              copyfile(newlogo, dest)

          Path("docs/src/index.md").write_text("""---
          title: SKILL-ISSUE
          description: Documentation cybersécurité
          next: false
          editLink: false
          ---

          # SKILL-ISSUE

          Documentation cybersécurité, techniques et commandes.

          Le site reprend les rubriques techniques et les ressources du référentiel existant, avec une navigation latérale et des exemples en blocs copiables.

          ## Explorer la documentation

          [Active Directory](/ad/recon/index.md)

          [Kerberos](/ad/movement/kerberos/index.md)

          [Windows](/infra/privilege-escalation/windows/index.md)

          [Web](/web/config/http-headers/index.md)

          [Réseaux et protocoles](/infra/protocols/index.md)

          Les notes des certifications seront organisées et complétées progressivement.
          """.replace("\n          ", "\n"), encoding="utf-8")

          Path("README.md").write_text("""# SKILL-ISSUE

          Documentation cybersécurité, basée sur VitePress.

          ## Lancer localement

          \`\`\`bash
          npm ci
          npm run docs:dev
          \`\`\`

          ## Compiler

          \`\`\`bash
          npm run docs:build
          \`\`\`

          ## Licence et provenance

          Ce projet contient du code et des documents réutilisés du dépôt libre
          [The Hacker Recipes](https://github.com/The-Hacker-Recipes/The-Hacker-Recipes).
          Les licences et notices d'origine sont conservées. Voir \`LICENSE\` et \`NOTICE.md\`.
          """.replace("\n          ", "\n"), encoding="utf-8")

          Path("NOTICE.md").write_text("""# Provenance et licences

          La base technique et documentaire provient du dépôt
          [The Hacker Recipes](https://github.com/The-Hacker-Recipes/The-Hacker-Recipes)
          et a été réadaptée pour le projet SKILL-ISSUE.

          La source est publiée sous GNU GPL v3. Son fichier LICENSE d'origine
          est conservé. Les avis de droit d'auteur et les attributions intégrés
          aux documents restent applicables.

          La nouvelle version retire les widgets de sponsors et de contributeurs
          de l'interface, modifie le thème, le logo et les métadonnées.
          """.replace("\n          ", "\n"), encoding="utf-8")

          print("SKILL-ISSUE brand applied")
          PY

      - name: Push complete rebranded source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new files to import"
          else
            git commit -m "Import full Hacker Recipes documentation and rebrand as SKILL-ISSUE"
            git push origin HEAD:main
          fi
          git ls-files | wc -l

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build full documentation
        run: |
          npm ci --no-audit --no-fund
          npm run docs:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - uses: actions/deploy-pages@v4
        id: deployment
