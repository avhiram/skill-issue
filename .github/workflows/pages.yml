name: Build SKILL-ISSUE website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/scripts/prepare_crto_for_vitepress.py'
      - '.github/workflows/pages.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skill-issue-site-write
  cancel-in-progress: false

jobs:
  build:
    if: github.event.head_commit.message != 'Publish compiled VitePress site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare CRTO placeholders for Vue rendering (working copy only)
        run: python3 .github/scripts/prepare_crto_for_vitepress.py
      - name: Build VitePress website
        run: npm run docs:build
      - name: Verify generated website
        run: |
          test -s docs/.vitepress/dist/index.html
          grep -q 'SKILL-ISSUE' docs/.vitepress/dist/index.html
          test -d docs/.vitepress/dist/assets
      - name: Restore CRTO sources before publishing
        run: git restore --worktree -- docs/src/crto/liham
      - name: Publish compiled website at GitHub Pages root
        run: |
          rsync -a docs/.vitepress/dist/ ./
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish compiled VitePress site"
            # Le dépôt peut recevoir une modification pendant le build.
            # Rebase sans force, puis réessaye pour éviter un rejet non-fast-forward.
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo "Publication refusée après plusieurs tentatives" >&2
            exit 1
          fi
