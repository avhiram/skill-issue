name: Build SKILL-ISSUE website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/scripts/prepare_crto_for_vitepress.py'
      - '.github/workflows/pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/audit_rendered_markdown.py'
      - '.github/scripts/normalize_site_dashes.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: skill-issue-site-write
  cancel-in-progress: false

jobs:
  build:
    if: github.event.head_commit.message != 'Publish compiled VitePress site'
    runs-on: ubuntu-latest
    outputs:
      published_head: ${{ steps.publish.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare CRTO placeholders for Vue rendering (working copy only)
        run: python3 .github/scripts/prepare_crto_for_vitepress.py
      - name: Normalize published prose typography
        run: python3 .github/scripts/normalize_site_dashes.py
      - name: Build VitePress website
        run: npm run docs:build
      - name: Verify generated website
        run: |
          test -s docs/.vitepress/dist/index.html
          grep -q 'SKILL-ISSUE' docs/.vitepress/dist/index.html
          test -d docs/.vitepress/dist/assets
          test -s docs/.vitepress/dist/academy/index.html
          grep -q 'academy-syllabus' docs/.vitepress/dist/academy/index.html
          grep -q 'Parcours gratuit' docs/.vitepress/dist/academy/index.html
          grep -q 'Parcours complet' docs/.vitepress/dist/academy/index.html
          if grep -Eqi 'harvard|cs50' docs/.vitepress/dist/academy/index.html; then
            echo 'Ressources Harvard/CS50 interdites dans Academy.'
            exit 1
          fi
          if grep -q 'Marquer comme terminée' docs/.vitepress/dist/academy/index.html; then
            echo 'Ancienne présentation Academy interdite.'
            exit 1
          fi
      - name: Verify Bug Bounty homepage and active reconnaissance
        run: |
          test -s docs/.vitepress/dist/bug-bounty/index.html
          grep -q 'Cheatsheet, méthodologie, outils et ressources pour le Bug Bounty.' docs/.vitepress/dist/bug-bounty/index.html
          grep -q 'Reconnaissance active' docs/.vitepress/dist/bug-bounty/index.html
          for page in index reconnaissance scan-reseau cartographie-web; do
            grep -q 'Cible du programme' "docs/.vitepress/dist/bug-bounty/$page.html"
            grep -q 'placeholder="example.com ou https://example.com"' "docs/.vitepress/dist/bug-bounty/$page.html"
          done
          if grep -Eq 'Cheatsheet technique classée|Lostsec - archive originale|35 blocs extraits' docs/.vitepress/dist/bug-bounty/index.html; then
            echo 'Ancienne introduction Bug Bounty détectée.'
            exit 1
          fi
      - name: Audit all rendered HTML for visible Markdown fences
        run: python3 scripts/audit_rendered_markdown.py docs/.vitepress/dist --output docs/.vitepress/dist/audit/site-rendering.json --strict
      - name: Stamp compiled pages with source revision
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          revision = os.environ['GITHUB_SHA']
          for path in Path('docs/.vitepress/dist').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              if '</head>' in html:
                  html = html.replace('</head>', f'<meta name="skill-issue-build" content="{revision}"></head>', 1)
                  path.write_text(html, encoding='utf-8')
          PY
      - name: Upload compiled website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - name: Restore CRTO sources before publishing
        run: git restore --worktree -- docs/src/crto/liham
      - name: Publish compiled website at GitHub Pages root
        id: publish
        run: |
          rsync -a docs/.vitepress/dist/ ./
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish compiled VitePress site"
            # Un build obsolète ne doit pas écraser une version source plus récente.
            # Pas de rebase des pages HTML générées : il créerait des conflits massifs.
            git fetch origin main
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
              echo "Une mise à jour plus récente existe : publication obsolète ignorée."
              exit 0
            fi
            if ! git push origin HEAD:main; then
              echo "La branche a évolué pendant la publication : laisser le build suivant publier."
              exit 0
            fi
          fi
          # Skip deployment if a newer source revision arrived during this build.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Publication obsolète ignorée.'
            exit 0
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: needs.build.outputs.published_head != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Refuse stale deployments
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ needs.build.outputs.published_head }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$actual" = "$EXPECTED_HEAD" || { echo '::error::Une version plus récente existe ; déploiement obsolète bloqué.'; exit 1; }
      - name: Deploy verified website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual public Academy page after deployment
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://avhiram.github.io/skill-issue/academy/index.html?deployment=${GITHUB_RUN_ID}-${attempt}" -o /tmp/academy-live.html; then
              if grep -Fq "content=\"${GITHUB_SHA}\"" /tmp/academy-live.html && grep -q 'academy-syllabus' /tmp/academy-live.html && grep -q 'Parcours gratuit' /tmp/academy-live.html && grep -q 'Parcours complet' /tmp/academy-live.html && ! grep -q 'Marquer comme terminée' /tmp/academy-live.html && ! grep -Eqi 'harvard|cs50' /tmp/academy-live.html; then
                echo 'Présentation Academy actuelle et absence de Harvard/CS50 confirmées sur le site public.'
                exit 0
              fi
            fi
            sleep 10
          done
          echo '::error::La page publique ne correspond pas à la présentation Academy compilée.'
          exit 1

      - name: Verify public Bug Bounty page after deployment
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://avhiram.github.io/skill-issue/bug-bounty/index.html?deployment=${GITHUB_RUN_ID}-${attempt}" -o /tmp/bug-bounty-live.html; then
              if grep -Fq "content=\"${GITHUB_SHA}\"" /tmp/bug-bounty-live.html && grep -q 'Cheatsheet, méthodologie, outils et ressources pour le Bug Bounty.' /tmp/bug-bounty-live.html && grep -q 'Reconnaissance active' /tmp/bug-bounty-live.html && grep -q 'Cible du programme' /tmp/bug-bounty-live.html && ! grep -Eq 'Cheatsheet technique classée|Lostsec - archive originale|35 blocs extraits' /tmp/bug-bounty-live.html; then
                echo 'Nouvelle page Bug Bounty confirmée.'
                exit 0
              fi
            fi
            sleep 10
          done
          echo '::error::La page publique Bug Bounty ne correspond pas à la nouvelle version.'
          exit 1
