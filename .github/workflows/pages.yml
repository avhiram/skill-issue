name: Build and publish SKILL-ISSUE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: skill-issue-publish
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.head_commit.message != 'Publish compiled VitePress site'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build VitePress website
        run: npm run docs:build
      - name: Verify generated website
        run: |
          test -s docs/.vitepress/dist/index.html
          grep -q 'SKILL-ISSUE' docs/.vitepress/dist/index.html
          test -d docs/.vitepress/dist/assets
      - name: Publish compiled pages to repository root
        run: |
          rsync -a docs/.vitepress/dist/ ./
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish compiled VitePress site"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4
