name: Build SKILL-ISSUE website

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Source changes committed by the maintenance jobs use GITHUB_TOKEN.
  # Their pushes do not start a second push workflow.
  workflow_run:
    workflows:
      - Integrate complete OSCP source
      - Review and translate all OSCP notes to French
      - Refine OSCP visual hierarchy
      - Audit and clarify OSCP command titles
      - Improve OSCP exam notes
      - Inspect OSCP documentation source
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  source:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_sha != github.sha))
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Select the source revision
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            # Only rebuild the direct commit created by this maintenance run.
            metadata=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '[.committer.login, .parents[0].sha] | @tsv')
            read -r author parent <<< "$metadata"
            [[ "$author" == 'github-actions[bot]' && "$parent" == "$MAINTENANCE_HEAD" ]] || exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    if: needs.source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare CRTO placeholders for Vue rendering (working copy only)
        run: python3 .github/scripts/prepare_crto_for_vitepress.py
      - name: Normalize published prose typography
        run: python3 .github/scripts/normalize_site_dashes.py
      - name: Prepare native VitePress eJPT chapters
        run: |
          python3 -m pip install --disable-pip-version-check markdown-it-py==3.0.0 beautifulsoup4==4.12.3
          python3 scripts/render_ejpt_original.py "$RUNNER_TEMP/ejpt-render"
          python3 scripts/prepare_ejpt_native.py "$RUNNER_TEMP/ejpt-render"
      - name: Build VitePress website
        run: npm run docs:build
      - name: Verify native eJPT build
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/.vitepress/dist/ejpt/original')
          report=json.loads((root/'import-report.json').read_text())
          assert len(report['pages'])==80
          for p in report['pages']:
              body=(root/p).read_text(encoding='utf-8')
              assert 'data-ejpt-native' in body and 'VPDoc' in body and 'VPNav' in body, p
          from bs4 import BeautifulSoup
          sheet=BeautifulSoup((root/'ejpt-cheatsheet.html').read_text(encoding='utf-8'),'html.parser').select_one('.ejpt-cheatsheet-content')
          assert sheet is not None, 'Missing native cheatsheet content'
          assert len(sheet.select('pre code'))==report['cheatsheet_display_blocks'], 'Unexpected change in displayed code block count'
          assert len(sheet.select('.ejpt-action-heading'))>=20, 'Missing information gathering action headings'
          assert len(sheet.select('.ejpt-existing-note-heading'))==report['cheatsheet_remaining_headings'], 'Incomplete remaining section headings'
          assert report['cheatsheet_remaining_headings']>=100, 'Incomplete remaining cheatsheet presentation'
          assert len(sheet.select('h4[id^="reseau-"]'))==15, 'Missing networking platform headings'
          assert not any('cheatsheet-files/ejpt-cheatsheet_nolinks.' in a.get('href','') for a in sheet.select('a[href]')), 'Obsolete export link'
          assert sheet.select_one('h2#complements-de-revision'), 'Missing folded complement'
          print('80 native VitePress eJPT pages validated; cheatsheet presentation and displayed block count verified (237 source blocks)')
          PY
      - name: Verify generated website
        run: |
          test -s docs/.vitepress/dist/index.html
          grep -q 'SKILL-ISSUE' docs/.vitepress/dist/index.html
          test -d docs/.vitepress/dist/assets
          test -s docs/.vitepress/dist/academy/index.html
          grep -q 'academy-syllabus' docs/.vitepress/dist/academy/index.html
          grep -q 'Parcours gratuit' docs/.vitepress/dist/academy/index.html
          grep -q 'Parcours complet' docs/.vitepress/dist/academy/index.html
          if grep -Eqi 'harvard|cs50' docs/.vitepress/dist/academy/index.html; then
            echo 'Ressources Harvard/CS50 interdites dans Academy.'
            exit 1
          fi
          if grep -q 'Marquer comme terminée' docs/.vitepress/dist/academy/index.html; then
            echo 'Ancienne présentation Academy interdite.'
            exit 1
          fi
      - name: Verify Bug Bounty homepage and active reconnaissance
        run: |
          test -s docs/.vitepress/dist/bug-bounty/index.html
          grep -q 'Cheatsheet, méthodologie, outils et ressources pour le Bug Bounty.' docs/.vitepress/dist/bug-bounty/index.html
          grep -q 'Reconnaissance active' docs/.vitepress/dist/bug-bounty/index.html
          for page in index preparation reconnaissance scan-reseau cartographie-web; do
            grep -q 'Cible du programme' "docs/.vitepress/dist/bug-bounty/$page.html"
            grep -q 'placeholder="example.com ou https://example.com"' "docs/.vitepress/dist/bug-bounty/$page.html"
          done
          grep -q 'Nom du programme' docs/.vitepress/dist/bug-bounty/preparation.html
          grep -q 'CHOISIR_UN_PROGRAMME' docs/.vitepress/dist/bug-bounty/preparation.html
          grep -q 'Installer les outils manquants' docs/.vitepress/dist/bug-bounty/preparation.html
          grep -q 'install-bugbounty-tools.sh' docs/.vitepress/dist/bug-bounty/preparation.html
          test -s docs/public/install-bugbounty-tools.sh
          bash -n docs/public/install-bugbounty-tools.sh
          grep -q 'GOTOOLCHAIN=auto' docs/public/install-bugbounty-tools.sh
          test -s docs/.vitepress/dist/install-bugbounty-tools.sh
          bash -n docs/.vitepress/dist/install-bugbounty-tools.sh
          grep -q 'GOTOOLCHAIN=auto' docs/.vitepress/dist/install-bugbounty-tools.sh
          grep -q 'Nom du programme' docs/.vitepress/dist/bug-bounty/index.html
          for page in preparation reconnaissance scan-reseau cartographie-web vulnerabilites validation rapport suivi; do
            grep -q 'class="bounty-checklist"' "docs/.vitepress/dist/bug-bounty/$page.html"
          done
          grep -q 'id="microsoft-iis-et-asp-net"' docs/.vitepress/dist/bug-bounty/vulnerabilites.html
          if grep -Fq 'microsoft-iis-et-aspnet' docs/.vitepress/dist/bug-bounty/index.html; then
            echo 'Ancre IIS incorrecte.'
            exit 1
          fi
          if grep -Eqi 'Cheatsheet technique classée|Lostsec - archive originale|35 blocs extraits' docs/src/bug-bounty/index.md; then
            echo 'Ancienne introduction Bug Bounty détectée dans la source.'
            exit 1
          fi
      - name: Audit all rendered HTML for visible Markdown fences
        run: python3 scripts/audit_rendered_markdown.py docs/.vitepress/dist --output docs/.vitepress/dist/audit/site-rendering.json --strict
      - name: Stamp compiled pages with source revision
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          revision = os.environ['GITHUB_SHA']
          for path in Path('docs/.vitepress/dist').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              if '</head>' in html:
                  html = html.replace('</head>', f'<meta name="skill-issue-build" content="{revision}"></head>', 1)
                  path.write_text(html, encoding='utf-8')
          PY
      - name: Upload compiled website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: skill-issue-pages-deploy
      queue: max
    environment:
      name: github-pages
      url: https://avhiram.github.io/skill-issue/
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          echo "Pages build_type=$mode"
          test "$mode" = workflow || { echo '::error::Sélectionner GitHub Actions dans Settings > Pages.'; exit 1; }
      - name: Refuse stale deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$actual" = "$GITHUB_SHA" || { echo '::error::Une version plus récente existe. Déploiement obsolète bloqué.'; exit 1; }
      - name: Deploy verified website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify all public eJPT course pages
        run: python3 scripts/verify_ejpt_public.py

      - name: Verify canonical homepage and index
        run: |
          base='https://avhiram.github.io/skill-issue'
          marker="<meta name=\"skill-issue-build\" content=\"$GITHUB_SHA\">"
          # Pages advertises max-age=600. Allow a full cache lifetime and a short margin.
          deadline=$((SECONDS + 660))
          while true; do
            current=true
            for url in "$base/" "$base/index.html"; do
              if status=$(curl -sS --max-time 20 -D "$RUNNER_TEMP/home-headers" -o "$RUNNER_TEMP/home-body" -w '%{http_code}' "$url") &&
                 [[ "$status" == 200 ]] && grep -Fq "$marker" "$RUNNER_TEMP/home-body"; then
                echo "$url HTTP 200 $GITHUB_SHA"
              else
                current=false
                echo "$url HTTP $status (expected $GITHUB_SHA)"
                grep -Eo '<meta name="skill-issue-build" content="[^"]+"' "$RUNNER_TEMP/home-body" || true
              fi
              grep -Ei '^(location|cache-control|age|etag|last-modified|x-cache|x-served-by|via|x-github-request-id):' "$RUNNER_TEMP/home-headers" || true
            done
            [[ "$current" == true ]] && exit 0
            (( SECONDS >= deadline )) && break
            sleep 15
          done
          echo '::error::Public homepage or index unavailable, redirected, or stale.'
          exit 1

      - name: Verify actual public Academy page after deployment
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 20 "https://avhiram.github.io/skill-issue/academy/index.html" -o /tmp/academy-live.html; then
              if grep -Fq "content=\"${GITHUB_SHA}\"" /tmp/academy-live.html && grep -q 'academy-syllabus' /tmp/academy-live.html && grep -q 'Parcours gratuit' /tmp/academy-live.html && grep -q 'Parcours complet' /tmp/academy-live.html && ! grep -q 'Marquer comme terminée' /tmp/academy-live.html && ! grep -Eqi 'harvard|cs50' /tmp/academy-live.html; then
                echo 'Présentation Academy actuelle et absence de Harvard/CS50 confirmées sur le site public.'
                exit 0
              fi
            fi
            sleep 15
          done
          echo '::error::La page publique ne correspond pas à la présentation Academy compilée.'
          exit 1

      - name: Verify public Bug Bounty page after deployment
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 20 "https://avhiram.github.io/skill-issue/bug-bounty/index.html" -o /tmp/bug-bounty-live.html; then
              if grep -Fq "content=\"${GITHUB_SHA}\"" /tmp/bug-bounty-live.html && grep -q 'Cheatsheet, méthodologie, outils et ressources pour le Bug Bounty.' /tmp/bug-bounty-live.html && grep -q 'Reconnaissance active' /tmp/bug-bounty-live.html && grep -q 'Cible du programme' /tmp/bug-bounty-live.html && grep -q 'Nom du programme' /tmp/bug-bounty-live.html && ! grep -Eq 'Cheatsheet technique classée|Lostsec - archive originale|35 blocs extraits' /tmp/bug-bounty-live.html; then
                echo 'Nouvelle page Bug Bounty confirmée.'
                exit 0
              fi
            fi
            sleep 15
          done
          echo '::error::La page publique Bug Bounty ne correspond pas à la nouvelle version.'
          exit 1

      - name: Verify public preparation workspace
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 20 "https://avhiram.github.io/skill-issue/bug-bounty/preparation.html" -o /tmp/preparation-live.html; then
              if grep -Fq "content=\"${GITHUB_SHA}\"" /tmp/preparation-live.html && grep -q 'Nom du programme' /tmp/preparation-live.html && grep -q 'install-bugbounty-tools.sh' /tmp/preparation-live.html && grep -q 'CHOISIR_UN_PROGRAMME' /tmp/preparation-live.html && grep -Fq 'mkdir -p &quot;./CHOISIR_UN_PROGRAMME&quot;/' /tmp/preparation-live.html && grep -Fq 'cd &quot;./CHOISIR_UN_PROGRAMME&quot;' /tmp/preparation-live.html && ! grep -Eq '\$HOME|~/bug-bounty|/home/' /tmp/preparation-live.html; then
                echo 'Préparation dynamique confirmée.'
                exit 0
              fi
            fi
            sleep 15
          done
          echo '::error::Ancienne préparation ou révision publique non confirmée.'
          exit 1

      - name: Verify public Bug Bounty installer
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 20 "https://avhiram.github.io/skill-issue/install-bugbounty-tools.sh" -o /tmp/install-bugbounty-tools.sh; then
              if bash -n /tmp/install-bugbounty-tools.sh && grep -q 'GOTOOLCHAIN=auto' /tmp/install-bugbounty-tools.sh && grep -q 'urlfinder' /tmp/install-bugbounty-tools.sh && grep -q 'gospider' /tmp/install-bugbounty-tools.sh && grep -q 'unfurl' /tmp/install-bugbounty-tools.sh && grep -q 'urldedupe' /tmp/install-bugbounty-tools.sh; then
                echo 'Installateur Bug Bounty public confirmé.'
                exit 0
              fi
            fi
            sleep 15
          done
          echo '::error::L’installateur Bug Bounty public est absent ou invalide.'
          exit 1
