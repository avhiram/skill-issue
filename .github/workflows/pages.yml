name: Build SKILL-ISSUE website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skill-issue-site-write
  cancel-in-progress: false

jobs:
  build:
    if: github.event.head_commit.message != 'Publish compiled VitePress site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build VitePress website
        run: npm run docs:build
      - name: Verify generated website
        run: |
          test -s docs/.vitepress/dist/index.html
          grep -q 'SKILL-ISSUE' docs/.vitepress/dist/index.html
          test -d docs/.vitepress/dist/assets
      - name: Publish compiled website at GitHub Pages root
        run: |
          rsync -a docs/.vitepress/dist/ ./
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish compiled VitePress site"
            git push origin HEAD:main
          fi
